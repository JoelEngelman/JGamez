<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>23-0 — JGamez</title><style>body{margin:0;background:#080a12;color:#fff;font:16px system-ui;text-align:center}main{max-width:900px;margin:auto;padding:40px 20px}canvas{background:#111522;border:1px solid #333;border-radius:16px;max-width:100%;touch-action:none}button{padding:12px 18px;border:0;border-radius:10px;margin:6px;font-weight:800;cursor:pointer}#start{background:#7c5cff;color:white}</style></head><body><main><h1>23-0</h1><p>JGamez original arcade challenge.</p><canvas id="game" width="800" height="500"></canvas><div><button id="start">START / RESTART</button></div><p>Move with WASD or arrow keys. Collect green energy, avoid red hazards. Survive as long as possible.</p></main><script>const c=document.getElementById('game'),x=c.getContext('2d');let p,e,score,running=false,last=0,keys={};addEventListener('keydown',a=>keys[a.key.toLowerCase()]=1);addEventListener('keyup',a=>keys[a.key.toLowerCase()]=0);function reset(){p={x:400,y:250,r:15};e=[];score=0;for(let i=0;i<7;i++)spawn();running=true;requestAnimationFrame(loop)}function spawn(){e.push({x:Math.random()*760+20,y:Math.random()*460+20,r:10+Math.random()*10,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3})}function loop(t){if(!running)return;let dt=Math.min((t-last)/16,2);last=t;p.x+=(keys.a||keys.arrowleft?-4:0)*dt+(keys.d||keys.arrowright?4:0)*dt;p.y+=(keys.w||keys.arrowup?-4:0)*dt+(keys.s||keys.arrowdown?4:0)*dt;p.x=Math.max(15,Math.min(785,p.x));p.y=Math.max(15,Math.min(485,p.y));x.clearRect(0,0,800,500);x.fillStyle='#111522';x.fillRect(0,0,800,500);e.forEach((q,i)=>{q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.x<q.r||q.x>800-q.r)q.vx*=-1;if(q.y<q.r||q.y>500-q.r)q.vy*=-1;x.fillStyle='#ff496f';x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill();if(Math.hypot(p.x-q.x,p.y-q.y)<p.r+q.r){running=false}});if(Math.random()<.025*dt)spawn();x.fillStyle='#64f5c4';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();score++;x.fillStyle='#fff';x.font='20px system-ui';x.fillText('Score: '+score,20,30);if(running)requestAnimationFrame(loop);else{x.font='36px system-ui';x.fillText('GAME OVER',310,240);x.font='18px system-ui';x.fillText('Press START to try again',315,275)}}document.getElementById('start').onclick=reset;x.fillStyle='#fff';x.font='24px system-ui';x.fillText('Press START',330,250);</script></body></html>
