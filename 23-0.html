<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>23-0 — JGamez</title><style>*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f5f7fb;font:15px system-ui}main{max-width:720px;margin:auto;padding:22px 16px}.top{display:flex;justify-content:space-between}.brand{font-size:25px;font-weight:900}.pill{border:1px solid #29303b;border-radius:99px;padding:7px 11px;color:#aeb8c7}.hero{text-align:center;padding:22px 0}.hero h1{font-size:56px;margin:0;letter-spacing:-5px}.hero p,.small{color:#8e99a9}.card{background:#11151d;border:1px solid #252c37;border-radius:22px;padding:20px;margin:14px 0}.slot,.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}.slot div{background:#191f29;border-radius:15px;padding:14px;text-align:center}.label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#7f8a9b}.slot b{display:block;font-size:19px;margin-top:4px}.player{border:1px solid #303846;background:#171c25;border-radius:16px;padding:15px;text-align:left;color:white;cursor:pointer}.player:hover{border-color:white}.player strong{font-size:17px}.stats{color:#aeb8c7;font-size:12px;margin-top:5px}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:900;cursor:pointer;background:#fff;color:#080a0f;margin-top:10px}.alt{background:#202631;color:white;border:1px solid #343d4c}.hidden{display:none}.roster{display:grid;gap:8px}.row{display:flex;justify-content:space-between;background:#171c25;border-radius:12px;padding:12px}.record{font-size:68px;font-weight:950;letter-spacing:-5px}.result{text-align:center}.good{color:#62e6a8}.bad{color:#ff6f82}.bar{height:9px;background:#252c37;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#fff}@media(max-width:500px){.players{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">JGamez</div><div class="pill">AFL • 23-0</div></div><section class="hero"><h1>23-0</h1><p>Build an all-era AFL side. Chase the perfect season.</p></section><section class="card"><div class="slot"><div><span class="label">Club</span><b id="club">—</b></div><div><span class="label">Era</span><b id="era">—</b></div></div><button class="btn" id="spin">SPIN FOR ROUND 1</button><div id="choices" class="hidden"><p class="label">Pick a legend</p><div id="players" class="players"></div><button class="btn alt" id="reroll">RE-ROLL ROUND</button></div></section><section class="card"><p class="label">Your five</p><div id="roster" class="roster"><div class="small">Pick DEF, MID, RUC, FWD and UTL across the four eras.</div></div></section><section id="result" class="card result hidden"></section><div class="small" style="text-align:center;padding:15px">Original JGamez implementation • simplified gameplay data</div></main><script>const pool=[['Carlton','1990s',[['Stephen Kernahan','FWD',9,9,10],['Greg Williams','MID',10,10,10],['Stephen Silvagni','DEF',10,9,10]]],['Essendon','2000s',[['Matthew Lloyd','FWD',10,8,9],['James Hird','MID',10,10,10],['Matthew Scarlett','DEF',9,9,9]]],['Brisbane Lions','2000s',[['Jonathan Brown','FWD',10,9,10],['Simon Black','MID',10,10,10],['Chris Johnson','DEF',9,8,9]]],['Geelong','2000s',[['Gary Ablett Jr','MID',10,10,10],['Tom Hawkins','FWD',9,9,9],['Matthew Scarlett','DEF',10,9,10]]],['Hawthorn','1980s',[['Jason Dunstall','FWD',10,9,10],['Leigh Matthews','MID',10,10,10],['Chris Langford','DEF',9,9,9]]],['West Coast','1990s',[['Peter Matera','MID',10,9,10],['Chris Judd','MID',10,10,10],['Glen Jakovich','DEF',10,10,10]]],['Sydney','2010s',[['Lance Franklin','FWD',10,9,10],['Josh Kennedy','MID',10,10,9],['Brett Kirk','MID',9,10,9]]],['Richmond','2010s',[['Jack Riewoldt','FWD',10,9,9],['Dustin Martin','MID',10,10,10],['Alex Rance','DEF',10,9,10]]],['Collingwood','2010s',[['Nick Daicos','MID',9,10,9],['Scott Pendlebury','MID',10,10,10],['Nick Maxwell','DEF',8,9,9]]],['North Melbourne','1990s',[['Wayne Carey','FWD',10,10,10],['Glenn Archer','DEF',10,10,10],['Peter Bell','MID',9,10,9]]]];let roster=[],round=0,rerolls=1,current;const $=x=>document.getElementById(x);function spin(){if(round>=5)return;current=pool[Math.floor(Math.random()*pool.length)];$('club').textContent=current[0];$('era').textContent=current[1];$('spin').classList.add('hidden');$('choices').classList.remove('hidden');let a=[...current[2]].sort(()=>Math.random()-.5);$('players').innerHTML=a.map((p,i)=>`<button class="player" data-i="${i}"><strong>${p[0]}</strong><div class="stats">${p[1]} · Career ${p[2]} · Impact ${p[3]} · Finals ${p[4]}</div></button>`).join('');document.querySelectorAll('.player').forEach(b=>b.onclick=()=>pick(a[+b.dataset.i]));$('reroll').disabled=!rerolls;$('reroll').textContent=rerolls?'RE-ROLL ROUND (1 LEFT)':'NO RE-ROLLS LEFT'}function pick(p){roster.push(p);round++;render();next()}function render(){$('roster').innerHTML=roster.map((p,i)=>`<div class="row"><span><b>${i+1}. ${p[0]}</b><br><span class="small">${p[1]} · Career ${p[2]} · Impact ${p[3]} · Finals ${p[4]}</span></span><span>★</span></div>`).join('')}function next(){if(round===5){finish();return}$('choices').classList.add('hidden');$('spin').classList.remove('hidden');$('spin').textContent=`SPIN FOR ROUND ${round+1}`}function finish(){let s=roster.reduce((a,p)=>a+p[2]+p[3]+p[4],0);let strength=Math.min(100,s/1.5);let wins=Math.max(0,Math.min(23,Math.round(23/(1+Math.exp(-(strength-83)/4)))));if(Math.random()<.1)wins=Math.max(0,wins-1);$('result').classList.remove('hidden');$('result').innerHTML=`<div class="label">FINAL SEASON</div><div class="record ${wins===23?'good':'bad'}">${wins}-${23-wins}</div><p>${wins===23?'🏆 PERFECT SEASON. YOU WENT 23-0!':'So close. Draft another five and chase perfection.'}</p><div class="bar"><i style="width:${wins/23*100}%"></i></div><p class="small">Team Rating: ${strength.toFixed(1)} / 100</p><button class="btn" onclick="location.reload()">DRAFT AGAIN</button>`}$('spin').onclick=spin;$('reroll').onclick=()=>{if(!rerolls)return;rerolls--;spin()};</script></body></html>
