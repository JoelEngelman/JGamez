<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>82-0 — JGamez</title><style>*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f5f7fb;font:15px system-ui}main{max-width:720px;margin:auto;padding:22px 16px}.top{display:flex;justify-content:space-between}.brand{font-size:25px;font-weight:900}.pill,.tag{border:1px solid #29303b;border-radius:99px;padding:7px 11px;color:#aeb8c7}.hero{text-align:center;padding:22px 0}.hero h1{font-size:56px;margin:0;letter-spacing:-5px}.hero p,.small{color:#8e99a9}.card{background:#11151d;border:1px solid #252c37;border-radius:22px;padding:20px;margin:14px 0}.slot,.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}.slot div{background:#191f29;border-radius:15px;padding:14px;text-align:center}.label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#7f8a9b}.slot b{display:block;font-size:19px;margin-top:4px}.player{border:1px solid #303846;background:#171c25;border-radius:16px;padding:15px;text-align:left;color:white;cursor:pointer}.player:hover{border-color:white}.player strong{font-size:17px}.stats{color:#aeb8c7;font-size:12px;margin-top:5px}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:900;cursor:pointer;background:#fff;color:#080a0f;margin-top:10px}.alt{background:#202631;color:white;border:1px solid #343d4c}.hidden{display:none}.roster{display:grid;gap:8px}.row{display:flex;justify-content:space-between;background:#171c25;border-radius:12px;padding:12px}.record{font-size:68px;font-weight:950;letter-spacing:-5px}.result{text-align:center}.good{color:#62e6a8}.bad{color:#ff6f82}.bar{height:9px;background:#252c37;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#fff}@media(max-width:500px){.players{grid-template-columns:1fr}} </style></head><body><main><div class="top"><div class="brand">JGamez</div><div class="pill">NBA • 82-0</div></div><section class="hero"><h1>82-0</h1><p>Can your all-time roster go undefeated?</p></section><section class="card"><div class="slot"><div><span class="label">Team</span><b id="team">—</b></div><div><span class="label">Decade</span><b id="era">—</b></div></div><button class="btn" id="spin">SPIN FOR ROUND 1</button><div id="choices" class="hidden"><p class="label">Pick one legend</p><div id="players" class="players"></div><button class="btn alt" id="skip">SKIP ROUND</button></div></section><section class="card"><p class="label">Your starting five</p><div id="roster" class="roster"><div class="small">Draft five legends from random team + decade slots.</div></div></section><section id="result" class="card result hidden"></section><div class="small" style="text-align:center;padding:15px">Original JGamez implementation • simplified gameplay data</div></main><script>const pool=[['Celtics','1960s',[['Bill Russell',15,22,4,2,5],['John Havlicek',20,7,5,2,1],['Bob Cousy',16,6,8,2,0]]],['Lakers','1980s',[['Magic Johnson',19,7,13,2,0],['Kareem Abdul-Jabbar',23,10,4,1,3],['James Worthy',21,6,3,1,1]]],['Bulls','1990s',[['Michael Jordan',30,6,5,3,1],['Scottie Pippen',20,8,6,3,1],['Dennis Rodman',7,13,3,1,1]]],['Spurs','2000s',[['Tim Duncan',21,12,3,1,2],['Tony Parker',18,3,6,1,0],['Manu Ginobili',17,4,5,2,0]]],['Cavaliers','2010s',[['LeBron James',27,8,8,2,1],['Kyrie Irving',25,4,6,2,0],['Kevin Love',19,11,2,1,1]]],['Warriors','2010s',[['Stephen Curry',27,5,7,2,0],['Kevin Durant',28,8,5,1,2],['Draymond Green',10,8,7,2,1]]],['Nuggets','2020s',[['Nikola Jokic',27,12,9,1,1],['Jamal Murray',21,4,6,1,0],['Aaron Gordon',16,6,3,1,1]]],['Bucks','2020s',[['Giannis Antetokounmpo',29,12,6,1,2],['Damian Lillard',28,4,7,1,0],['Khris Middleton',20,6,5,1,0]]],['76ers','1970s',[['Julius Erving',28,11,5,2,2],['Moses Malone',25,15,1,1,2],['Hal Greer',22,5,6,2,0]]],['Lakers','2000s',[['Kobe Bryant',28,6,5,2,1],['Shaquille O’Neal',27,12,3,1,3],['Pau Gasol',18,9,3,1,2]]]];let roster=[],round=0,skips=1,current;const $=x=>document.getElementById(x);function spin(){if(round>=5)return;current=pool[Math.floor(Math.random()*pool.length)];$('team').textContent=current[0];$('era').textContent=current[1];$('spin').classList.add('hidden');$('choices').classList.remove('hidden');let a=[...current[2]].sort(()=>Math.random()-.5);$('players').innerHTML=a.map((p,i)=>`<button class="player" data-i="${i}"><strong>${p[0]}</strong><div class="stats">PTS ${p[1]} · REB ${p[2]} · AST ${p[3]} · STL ${p[4]} · BLK ${p[5]}</div></button>`).join('');document.querySelectorAll('.player').forEach(b=>b.onclick=()=>pick(a[+b.dataset.i]));$('skip').disabled=!skips}function pick(p){roster.push(p);round++;render();next()}function render(){$('roster').innerHTML=roster.map((p,i)=>`<div class="row"><span><b>${i+1}. ${p[0]}</b><br><span class="small">PTS ${p[1]} · REB ${p[2]} · AST ${p[3]} · STL ${p[4]} · BLK ${p[5]}</span></span><span>★</span></div>`).join('')}function next(){if(round===5){finish();return}$('choices').classList.add('hidden');$('spin').classList.remove('hidden');$('spin').textContent=`SPIN FOR ROUND ${round+1}`}function finish(){let s=roster.reduce((a,p)=>a+p[1]+p[2]*.65+p[3]*.75+p[4]*1.5+p[5]*1.5,0);let strength=Math.min(100,s/3.55);let wins=Math.max(0,Math.min(82,Math.round(82/(1+Math.exp(-(strength-82)/7)))));if(Math.random()<.12)wins=Math.max(0,wins-1);$('result').classList.remove('hidden');$('result').innerHTML=`<div class="label">FINAL SEASON</div><div class="record ${wins===82?'good':'bad'}">${wins}-${82-wins}</div><p>${wins===82?'🏆 PERFECT SEASON. 82-0!':'Not undefeated. Draft again and chase perfection.'}</p><div class="bar"><i style="width:${wins/82*100}%"></i></div><p class="small">Team Strength: ${strength.toFixed(1)} / 100</p><button class="btn" onclick="location.reload()">DRAFT AGAIN</button>`}$('spin').onclick=spin;$('skip').onclick=()=>{if(!skips)return;skips--;round++;next();$('team').textContent='Skipped';$('era').textContent='—'};</script></body></html>
