<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>82-0 — JGamez</title><style>body{margin:0;background:#070b12;color:#fff;font:16px system-ui;text-align:center}main{max-width:900px;margin:auto;padding:40px 20px}canvas{background:#101823;border:1px solid #334;border-radius:16px;max-width:100%;touch-action:none}button{padding:12px 18px;border:0;border-radius:10px;margin:6px;font-weight:800;cursor:pointer;background:#54d8ff;color:#061018}</style></head><body><main><h1>82-0</h1><p>JGamez original survival run.</p><canvas id="game" width="800" height="500"></canvas><div><button id="start">START / RESTART</button></div><p>Move with WASD or arrow keys. Grab cyan cores for points and survive the accelerating swarm.</p></main><script>const c=document.getElementById('game'),x=c.getContext('2d');let p,items,score,running,last,keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);function reset(){p={x:400,y:250,r:14};items=[];score=0;running=true;last=0;for(let i=0;i<5;i++)add();requestAnimationFrame(loop)}function add(){let a=Math.random()*7;items.push({x:Math.random()*760+20,y:Math.random()*460+20,r:11,vx:Math.cos(a)*1.8,vy:Math.sin(a)*1.8})}function loop(t){if(!running)return;let d=Math.min((t-last)/16,2);last=t;let sp=4.2;p.x+=((keys.a||keys.arrowleft?-sp:0)+(keys.d||keys.arrowright?sp:0))*d;p.y+=((keys.w||keys.arrowup?-sp:0)+(keys.s||keys.arrowdown?sp:0))*d;p.x=Math.max(14,Math.min(786,p.x));p.y=Math.max(14,Math.min(486,p.y));x.fillStyle='#101823';x.fillRect(0,0,800,500);items.forEach(q=>{q.x+=q.vx*d;q.y+=q.vy*d;if(q.x<q.r||q.x>800-q.r)q.vx*=-1;if(q.y<q.r||q.y>500-q.r)q.vy*=-1;x.fillStyle='#ff557d';x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill();if(Math.hypot(p.x-q.x,p.y-q.y)<p.r+q.r){running=false}});if(Math.random()<.018*d) add();x.fillStyle='#54d8ff';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();score++;x.fillStyle='#fff';x.font='20px system-ui';x.fillText('Score: '+score,20,30);if(running)requestAnimationFrame(loop);else{x.font='36px system-ui';x.fillText('RUN ENDED',310,240);x.font='18px system-ui';x.fillText('Press START to play again',315,275)}}document.getElementById('start').onclick=reset;x.fillStyle='#fff';x.font='24px system-ui';x.fillText('Press START',330,250);</script></body></html>
